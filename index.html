<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Study digital logic across six editions with original notes and paired SystemVerilog and VHDL examples.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Digital Design Study Companion</title>
  <link rel="stylesheet" href="assets/reader.css">
  <script defer src="assets/vendor/marked.js"></script>
  <script defer src="assets/vendor/prism-core.min.js" data-manual></script>
  <script defer src="assets/vendor/prism-verilog.min.js"></script>
  <script defer src="assets/vendor/prism-vhdl.min.js"></script>
  <script defer src="assets/reader.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="workspace">
    <header class="topbar">
      <button class="menu-toggle" type="button" aria-controls="library" aria-expanded="false">Browse</button>
      <a class="brand" href="#README.md"><span class="brand-mark" aria-hidden="true"></span>Digital Design</a>
      <span class="topbar-caption">Study companion</span>
    </header>
    <aside class="library" id="library">
      <label for="find">Filter library</label>
      <input id="find" type="search" placeholder="Notes, editions, HDL…" autocomplete="off">
      <nav id="navigation" aria-label="Study library"></nav>
    </aside>
    <main id="content" tabindex="-1">
      <div class="document-bar">
        <p id="location" class="document-location"></p>
        <div class="actions">
          <button id="copy" type="button" hidden>Copy code</button>
          <a id="source" hidden>Open source</a>
        </div>
      </div>
      <nav id="languages" class="languages" aria-label="HDL language" hidden></nav>
      <div class="reading-layout">
        <article id="document" class="document" aria-label="Selected file"></article>
        <nav id="outline" class="outline" aria-label="On this page" hidden></nav>
      </div>
      <p id="status" class="status" role="status"></p>
      <noscript><p>Enable JavaScript to use the reader, or open the <a href="README.md">Markdown index</a> and <a href="examples/README.md">HDL example index</a>.</p></noscript>
    </main>
  </div>
</body>
</html>
