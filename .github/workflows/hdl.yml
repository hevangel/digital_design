name: HDL regression
on:
  push:
  pull_request:
jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source HDL simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog ghdl
      - name: Run all HDL tests
        run: bash tests/run.sh
